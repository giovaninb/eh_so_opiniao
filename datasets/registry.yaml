    licenca: "Não declarada no repositório (sem arquivo LICENSE; GitHub: license=null). O artigo informa disponibilização exclusivamente para fins acadêmicos."
    redistribuicao: "Não. Sem licença declarada, nenhuma redistribuição é presumida: o corpus não vai ao Git, ao site nem a terceiros."
    acesso: aberto
    status_acesso: acessado
    integracao: integrado
    condicoes_licenca:
      declarada: false
      identificador: "nenhuma (sem LICENSE no repositório; artigo: 'exclusivamente para fins acadêmicos')"
      fonte_da_verificacao: "API do GitHub (license=null), árvore do repositório no commit 3d6ca38c e seção 8 (Considerações Éticas) do artigo."
      uso_pelo_projeto: "Pesquisa acadêmica sem fins comerciais, apenas em cache local; apenas métricas agregadas são publicadas."
      restricoes:
        - "somente fins acadêmicos (declaração do artigo)"
        - "sem redistribuição dos comentários, dos vetores de rótulos nem das planilhas de anotadores"
        - "sem publicar comentários no site nem no Git"
        - "licença formal ausente: recomenda-se pedir confirmação por escrito aos autores antes de qualquer uso além da pesquisa local"
      exige_reconhecimento_do_operador: true
      verificado_em: "2026-10-29"
    formatos: [csv, xlsx]
    registros_confirmados: 5000
    nota_contagem: "5.000 linhas em cada CSV (1 texto vazio e 15 duplicatas exatas incluídos); 6 planilhas com 2.500 linhas cada (2 grupos de 3 anotadores)."
    esquema_anotacao: "Cada comentário tem 3 anotadores (dois grupos independentes de três: grupo 1 anotou os 2.500 primeiros, grupo 2 os 2.500 restantes). Nove categorias binárias por anotador, mais a coluna 'inválido'. O vetor do CSV é o consenso por maioria (>=2 de 3) em cada categoria; o rótulo binário é 1 se qualquer categoria tem consenso."
    rotulos_originais: [insulto_de_baixo_calao, homofobia, racismo, misoginia_machismo, xenofobia, violencia_extremismo, intolerancia_religiosa, intolerancia_politica, anticapacitismo]
    idioma: pt-BR
    plataforma: youtube
    contexto: "Comentários de 50 vídeos (2 por termo de busca, 25 termos) em cinco domínios temáticos: política polarizada, futebol, conflitos internacionais, feminismo e direitos das mulheres, conteúdo LGBTQIA+. O domínio e o vídeo de cada comentário NÃO constam nos arquivos publicados (as planilhas foram embaralhadas e só a coluna do comentário foi mantida)."
    hash_ou_revisao: "sha256 dos arquivos (acima) e commit git 3d6ca38c"
    ficha_cientifica:
      verificacao_do_esquema:
        verificado_em: "2026-10-29"
        csv_binario: "cabeçalho text,label; 5.000 linhas; label ∈ {0,1} (3.546 zeros e 1.454 uns)."
        csv_multirrotulo: "cabeçalho text,label; 5.000 linhas; label é uma string '[a, b, ..., i]' com 9 inteiros 0/1 (42 vetores distintos). Os nomes das classes NÃO estão no arquivo."
        planilhas: "cabeçalho comentario + 9 categorias + inválido; valores 0/1 por anotador."
      ordem_do_vetor_multirrotulo:
        ordem_verificada: [insulto_de_baixo_calao, homofobia, racismo, misoginia_machismo, xenofobia, violencia_extremismo, intolerancia_religiosa, intolerancia_politica, anticapacitismo]
        como_foi_verificada: "O vetor de cada uma das 5.000 linhas foi reconstruído a partir das seis planilhas (maioria >=2 de 3 por grupo) e comparado posição a posição; as 9 posições coincidem 100% com as 9 colunas das planilhas na ordem acima, e o rótulo binário coincide 100% com 'qualquer categoria'. A ordem também é a de `classesFinais` no notebook 3_Tratamento (autores) e a do guia de anotação."
        divergencia_do_readme: "O README descreve o vetor como [insulto, obsceno, homofobia, racismo, misoginia, xenofobia, violência, intolerância_religiosa, intolerância_política]. Isso é inconsistente com os dados: não existe categoria 'obsceno', falta 'anticapacitismo', e todas as posições seguintes ao insulto ficariam deslocadas. NÃO foi usada a ordem do README."
        nota_sobre_o_nome_anticapacitismo: "A coluna se chama 'anticapacitismo', mas a definição do guia descreve comentários que zombam, menosprezam ou desumanizam pessoas com deficiência, isto é, conteúdo capacitista. O rótulo mede a PRESENÇA de capacitismo."
      concordancia_reportada_no_artigo:
        medida: "Kappa de Fleiss por categoria e por grupo (alfa de Krippendorff difere menos de 0,0001)"
        grupo_1: {insulto_de_baixo_calao: 0.481, homofobia: 0.734, racismo: 0.422, misoginia_machismo: 0.532, xenofobia: 0.329, violencia_extremismo: 0.364, intolerancia_religiosa: 0.549, intolerancia_politica: 0.584, anticapacitismo: 0.443, media: 0.493}
        grupo_2: {insulto_de_baixo_calao: 0.262, homofobia: 0.442, racismo: 0.332, misoginia_machismo: 0.407, xenofobia: 0.420, violencia_extremismo: 0.215, intolerancia_religiosa: 0.555, intolerancia_politica: 0.499, anticapacitismo: 0.218, media: 0.372}
        observacao: "A concordância recalculada a partir das planilhas está em relatorios/concordancia_multidomain_yt_toxbr.json (comando `concordancia`)."
      composicao_reportada_no_artigo:
        total: 5000
        por_dominio: "1.000 comentários por domínio (100 por vídeo; 50% sinalizados como potencialmente tóxicos pelo Detoxify, 50% aleatórios)"
        prevalencias_reportadas: "insulto 18,5%; intolerância política 5,1%; homofobia 3,1%; racismo 17 comentários (0,34%); anticapacitismo 32 (0,64%); violência/extremismo 57 (1,14%)"
      desempenho_reportado_no_artigo:
        binario: "F1 0,78 (BERTweet.BR, teste de 500 comentários). NÃO é indicador de capacidade de identificar categorias específicas."
        multirrotulo: "F1 médio 0,11; só insulto (0,50) e intolerância política (0,52) têm F1 > 0; as outras sete categorias têm F1 0,00; racismo tinha 2 exemplos e anticapacitismo 3 no teste."
      domino_tematico_disponivel_por_comentario: false
    limitacoes_vieses:
      - "Sem licença declarada: uso restrito à pesquisa acadêmica local, sem redistribuição."
      - "Amostragem enviesada: 50% dos comentários de cada vídeo foram escolhidos por pontuação do Detoxify (modelo treinado sobretudo em inglês), o que superestima a prevalência de toxicidade e favorece marcadores explícitos."
      - "Domínio temático e identificador do vídeo ausentes nos arquivos: não é possível dividir por vídeo nem reportar resultados por domínio; comentários do mesmo vídeo podem cair em divisões diferentes."
      - "Duas turmas de três anotadores (nenhum anotador viu o corpus inteiro); concordância moderada no grupo 1 e justa no grupo 2 (kappa médio 0,493 e 0,372)."
      - "Categorias raras: racismo tem apenas 17 comentários por consenso; resultados por classe são instáveis."
      - "Os anotadores trabalharam sem discutir; divergências foram preservadas nas planilhas, mas o CSV só traz o consenso por maioria."
      - "A coluna 'inválido' (marcada em 1.472 de 2.500 linhas pelo anotador 2) é descartada pelos autores; foi preservada aqui como metadado e não como rótulo."
      - "Rótulo binário inclui insulto de baixo calão: 'tóxico' neste corpus não é sinônimo de discurso de ódio."
