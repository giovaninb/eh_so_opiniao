    acesso: aberto
    status_acesso: acessado
    integracao: integrado
    condicoes_licenca:
      declarada: true
      identificador: CC-BY-NC-4.0
      fonte_da_verificacao: "Repositório oficial franciellevargas/HateBR (licença e README)."
      uso_pelo_projeto: "Pesquisa e educação sem fins comerciais; apenas métricas agregadas são publicadas."
      restricoes: ["atribuição", "somente uso não comercial"]
      exige_reconhecimento_do_operador: false
      verificado_em: "2026-10-28"
    verificacao_cruzada_hatebrxplain:
      repositorio_auditado: https://github.com/isadorasalles/HateBRXplain
      revisao_auditada: "main@e951f1755b (2025-02-04)"
      verificado_em: "2026-10-29"
      conteudo_do_repositorio: "data/HateBRXplain.json e data/hatebr_and_rationales.csv (7.000 comentários), notebooks de classificadores (mBERT, BERTimbau, DistilBERTimbau, PTT5), explicabilidade com LIME e SHAP, métricas de plausibilidade e fidelidade, concordância entre anotadores."
      comparacao_com_o_arquivo_integrado: "Os mesmos 7.000 comentários; os trechos de justificativa de 6.998 dos 7.000 são idênticos aos de HateBRXplain.csv (franciellevargas/HateBR), com mesma ordem de anotadores. Os trechos não localizáveis no texto (cerca de 1,2%) são os mesmos nas duas fontes. Nenhum dado novo foi integrado."
      licenca_no_repositorio_auditado: "Não declarada (sem arquivo LICENSE; README não cita licença). O projeto continua lendo apenas o arquivo do repositório com licença CC-BY-NC-4.0."
      uso_no_projeto: "Apoia o experimento de explicabilidade (trechos relevantes, protocolo AMP-F). Pontuações de LIME/SHAP do repositório NÃO são importadas."
    formatos: [csv]
    registros_confirmados: 7000
    esquema_anotacao: "Binário (ofensivo/não) com 3 anotadores especialistas; HateBRXplain acrescenta justificativas (rationales) de 2 anotadores como trechos de texto. Níveis de ofensa e alvos de ódio existem só na versão 1.0, sob pedido, NÃO integrados."
    rotulos_originais: [anotator1, anotator2, anotator3, label_final, offensive_label, rationales_annotator1, rationales_annotator2]
    idioma: pt-BR
    plataforma: instagram
    contexto: "Comentários em publicações de políticos brasileiros (78 publicações no arquivo). O nome da conta do político NÃO é carregado para as amostras normalizadas."
    hash_ou_revisao: "sha256 dos arquivos (acima) e commit git a1301437"
    limitacoes_vieses:
      - Domínio político em Instagram; ofensa binária mistura insulto, xingamento e discurso de ódio.
      - Só 78 publicações; split por publicação gera poucos grupos.
      - Rationales são trechos textuais, não offsets; offsets são derivados por busca e podem falhar.
      - Equilíbrio artificial 50/50 (3.500/3.500) não reflete prevalência real.
