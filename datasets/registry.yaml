# Catálogo de datasets — "É Só Opinião?" — versão do catálogo 1.0.0
# Consultado em 2026-10-28. "registros_confirmados: null" = NÃO confirmado por leitura do arquivo.
#
# acesso:
#   aberto               -> download sem credencial; o pipeline baixa com cache e valida integridade.
#   restrito_autorizacao -> exige aceite/credencial do operador (HF gated). O pipeline NUNCA contorna;
#                           sem token válido o dataset fica "pendente_autorizacao" e o resto segue.
versao_catalogo: "1.0.0"
politica_geral:
  corpora_brutos_no_git: false
  contornar_controle_de_acesso: false
  reidentificar_autores_ou_anotadores: false
  usar_tybyria_como_classificador: false
datasets:
  told_br:
    nome: ToLD-Br — Toxic Language Detection for Brazilian Portuguese
    adaptador: ToldBrAdapter
    versao: "main@6b325d26a9d25b321a3e9ba98ef98832b56729f5"
    data_versao: "2025-02-22"
    autores:
      - João A. Leite
      - Diego F. Silva
      - Kalina Bontcheva
      - Carolina Scarton
    referencia: "Leite et al. (2020). Toxic Language Detection in Social Media for Brazilian Portuguese: New Dataset and Multilingual Analysis. arXiv:2010.04543 (AACL-IJCNLP 2020)."
    url_origem: https://github.com/JAugusto97/ToLD-Br
    url_arquivos:
      - arquivo: ToLD-BR.csv
        url: https://raw.githubusercontent.com/JAugusto97/ToLD-Br/main/ToLD-BR.csv
        sha256: a905b90d5886b9c80d737aa26c41dd29077155f23b9b857080634a78f8203c90
        bytes: 2430416
    licenca: CC-BY-SA-4.0
    redistribuicao: "Permitida com atribuição e mesma licença. Mesmo assim, este projeto NÃO redistribui o corpus (nem no Git nem no site)."
    acesso: aberto
    status_acesso: acessado
    formatos: [csv]
    registros_confirmados: 21000
    esquema_anotacao: "3 anotadores por tweet; 6 categorias com contagem de votos 0-3 (float no CSV)."
    rotulos_originais: [homophobia, obscene, insult, racism, misogyny, xenophobia]
    idioma: pt-BR
    plataforma: twitter
    contexto: "Tweets gerais; não é corpus político."
    hash_ou_revisao: "sha256 do arquivo (acima) e commit git 6b325d26"
    limitacoes_vieses:
      - Sem identificadores nem metadados de conversa; deduplicação só por texto.
      - Categorias raras (xenofobia, racismo) com poucos positivos por consenso.
      - Amostra por palavras-chave e perfis; viés de coleta e de anotadores (42 voluntários).
      - A distribuição e a duplicata de retweets podem inflar métricas se o split ignorar quase-duplicatas.
  hatebr:
    nome: HateBR 2.0 e HateBRXplain
    adaptador: HateBrAdapter
    versao: "main@a1301437a7b21620fbf0110a300c4c927a247daf"
    data_versao: "2026-01-05"
    autores:
      - "HateBR (LREC 2022): Francielle Vargas, Isabelle Carvalho, Fabiana Rodrigues de Góes, Thiago Pardo, Fabrício Benevenuto"
      - "HateBRXplain (COLING 2025): Isadora Salles, Francielle Vargas, Fabrício Benevenuto"
    referencia: "Vargas et al. (2022) HateBR, LREC 2022, aclanthology 2022.lrec-1.777; Salles, Vargas & Benevenuto (2025) HateBRXplain, COLING 2025, aclanthology 2025.coling-main.446."
    url_origem: https://github.com/franciellevargas/HateBR
    url_arquivos:
      - arquivo: HateBR.csv
        url: https://raw.githubusercontent.com/franciellevargas/HateBR/main/dataset/HateBR.csv
        sha256: 0586a15eea2d9e7743b19ccd5385eedf4074ccf4cfc530cc161bbd3fe5b1ec15
        bytes: 1128085
      - arquivo: HateBRXplain.csv
        url: https://raw.githubusercontent.com/franciellevargas/HateBR/main/dataset/HateBRXplain.csv
        sha256: dd2b669ab8c055805b4813b2628961d951273577fc637039f5eec1238cc9f8bb
        bytes: 1286709
    licenca: CC-BY-NC-4.0
    redistribuicao: "Somente uso não comercial, com atribuição. O corpus NÃO é redistribuído por este projeto."
    acesso: aberto
    status_acesso: acessado
    formatos: [csv]
    registros_confirmados: 7000
    esquema_anotacao: "Binário (ofensivo/não) com 3 anotadores especialistas; HateBRXplain acrescenta justificativas (rationales) de 2 anotadores como trechos de texto. Níveis de ofensa e alvos de ódio existem só na versão 1.0, sob pedido, NÃO integrados."
    rotulos_originais: [anotator1, anotator2, anotator3, label_final, offensive_label, rationales_annotator1, rationales_annotator2]
    idioma: pt-BR
    plataforma: instagram
    contexto: "Comentários em publicações de políticos brasileiros (78 publicações no arquivo). O nome da conta do político NÃO é carregado para as amostras normalizadas."
    hash_ou_revisao: "sha256 dos arquivos (acima) e commit git a1301437"
    limitacoes_vieses:
      - Domínio político em Instagram; ofensa binária mistura insulto, xingamento e discurso de ódio.
      - Só 78 publicações; split por publicação gera poucos grupos.
      - Rationales são trechos textuais, não offsets; offsets são derivados por busca e podem falhar.
      - Equilíbrio artificial 50/50 (3.500/3.500) não reflete prevalência real.
