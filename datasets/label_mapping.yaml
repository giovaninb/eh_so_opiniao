# Mapeamento de rótulos originais -> taxonomia "É Só Opinião?" — versão 1.0.0
#
# relacao:
#   equivalente  -> definição e escopo da fonte coincidem com a classe da taxonomia.
#   aproximado   -> há sobreposição relevante, mas escopo, definição ou domínio diferem.
#   incompativel -> o rótulo não tem correspondente na taxonomia v1 (preservado só no original).
#
# Regras:
#  - Não se fundem datasets: cada amostra carrega apenas rótulos do seu dataset.
#  - Valores ausentes (None) são permitidos.
#  - "aproximado" NUNCA é tratado como "equivalente" em experimentos; os experimentos C medem
#    justamente o custo dessa aproximação.
#  - A tabela documentada (docs/MAPEAMENTO_ROTULOS.md) é gerada a partir deste arquivo.
versao: "1.0.0"
datasets:
  told_br:
    rotulos:
      homophobia:
        alvo: lgbtfobia
        relacao: aproximado
        nota: Votos 0-3 por categoria; a fonte descreve LGBTQ+fobia, sem distinguir orientação de identidade de gênero.
      obscene:
        alvo: null
        relacao: incompativel
        nota: Obscenidade não é ofensa dirigida; sem classe própria na taxonomia v1. Contribui apenas ao rótulo derivado toxico_qualquer_categoria.
      insult:
        alvo: insulto_hostilidade
        relacao: aproximado
        nota: Insulto em tweets; sem distinção entre alvo individual e coletivo.
      racism:
        alvo: racismo
        relacao: equivalente
        nota: Mesma definição de preconceito racial/étnico.
      misogyny:
        alvo: misoginia
        relacao: equivalente
        nota: Anotação específica de misoginia.
      xenophobia:
        alvo: xenofobia
        relacao: aproximado
        nota: Classe rara; não distingue origem nacional de regional.
    derivados:
      toxico_qualquer_categoria:
        alvo: linguagem_ofensiva
        relacao: aproximado
        nota: Derivado por política de consenso (ver adaptador); ToLD-Br não tem rótulo binário próprio na versão multirrótulo.
  hatebr:
    rotulos:
      offensive_label:
        alvo: linguagem_ofensiva
        relacao: aproximado
        nota: HateBR 2.0/HateBRXplain é binário (ofensivo/não); comentários do Instagram dirigidos a políticos.
      hate_speech:
        alvo: null
        relacao: incompativel
        nota: Camadas de discurso de ódio, nível de ofensa e alvos existem só na versão 1.0, sob pedido; indisponíveis aqui.
  olid_br:
    rotulos:
      is_offensive:
        alvo: linguagem_ofensiva
        relacao: aproximado
        nota: Rótulo com apoio da Perspective API e checagem por anotadores.
      insult:
        alvo: insulto_hostilidade
        relacao: aproximado
        nota: Categoria de ofensa; não implica alvo.
      profanity_obscene:
        alvo: null
        relacao: incompativel
        nota: Xingamento/obscenidade sem classe própria na taxonomia v1; já está coberto por is_offensive. Preservado em original_labels.
      racism:
        alvo: racismo
        relacao: equivalente
        nota: Mesma definição.
      sexism:
        alvo: misoginia
        relacao: aproximado
        nota: Sexismo é mais amplo que misoginia.
      lgbtqphobia:
        alvo: lgbtfobia
        relacao: aproximado
        nota: ""
      xenophobia:
        alvo: xenofobia
        relacao: aproximado
        nota: ""
      ideology:
        alvo: hostilidade_politica
        relacao: aproximado
        nota: Ofensa por ideologia; não é detector de preferência política nem de assédio eleitoral.
      religious_intolerance:
        alvo: null
        relacao: incompativel
        nota: Sem classe correspondente na taxonomia v1.
      health:
        alvo: null
        relacao: incompativel
        nota: Sem classe correspondente na taxonomia v1.
      physical_aspects:
        alvo: null
        relacao: incompativel
        nota: Sem classe correspondente na taxonomia v1.
      other_lifestyle:
        alvo: null
        relacao: incompativel
        nota: Sem classe correspondente na taxonomia v1.
      is_targeted:
        alvo: null
        relacao: incompativel
        nota: Metadado de alvo (TIN/UNT) preservado em annotation_metadata.
      targeted_type:
        alvo: null
        relacao: incompativel
        nota: IND/GRP/OTH preservado em annotation_metadata.
