    citacao: "de Souza, L. E. C., de Lima, T. J. S., de Paula, A. S., Pereira, C. R. (2025). Escala de Preconceito contra Nordestinos. Psico, 56(1), e47118. doi:10.15448/1980-8623.2025.1.47118."
    papel_no_projeto: "Referência TEÓRICA para uma taxonomia de estereótipos regionais (três fatores: incompetência, inferioridade, sociabilidade; Modelo de Conteúdo de Estereótipos). Apoia a leitura da classe exploratória 'discriminação regional'."
