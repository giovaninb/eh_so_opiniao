    ano: 2026
    veiculo: "PROPOR 2026, vol. 1, pp. 770-779 (ACL Anthology)"
    url: https://aclanthology.org/2026.propor-1.76/
    citacao: "Vaz, J. V., Benevenuto, F., Gonçalves, M. A. (2026). RacismoBR: A Manually Annotated Dataset for Racist Discourse Detection in Brazilian Portuguese. PROPOR 2026, 770-779."
    papel_no_projeto: "Fonte da definição operacional, da composição e do método de anotação do RacismoBR. O dataset está pendente de fonte pública (ver registry.yaml); nenhum dado dele é usado."
