  - id: multidomain_yt_toxbr_artigo
    tipo: artigo
    titulo: "MultiDomainYT-ToxBR: Um Corpus Multidomínio de Comentários Tóxicos do YouTube em Português Brasileiro"
    autores: ["Gabriel Z. de Souza", "Isabel H. Manssour"]
    ano: 2026
    veiculo: "STIL 2026 (ACL Anthology)"
    url: https://aclanthology.org/2026.stil-1.36/
    citacao: "de Souza, G. Z., Manssour, I. H. (2026). MultiDomainYT-ToxBR: Um Corpus Multidomínio de Comentários Tóxicos do YouTube em Português Brasileiro. STIL 2026."
    papel_no_projeto: "Fonte da taxonomia de nove categorias, da concordância reportada e do desempenho de referência. O F1 binário de 0,78 NÃO mede a capacidade de identificar categorias; no multirrótulo o artigo reporta F1 médio de 0,11."
    licenca_ou_direitos: "Artigo em acesso aberto na ACL Anthology."
    o_que_nao_e: "Não declara licença do corpus; o artigo informa apenas uso acadêmico."
  - id: hatebrxplain
    tipo: recurso_explicabilidade
    titulo: "HateBRXplain: A Benchmark Dataset with Human-Annotated Rationales for Explainable Hate Speech Detection in Brazilian Portuguese"
    autores: ["Isadora Salles", "Francielle Vargas", "Fabrício Benevenuto"]
    ano: 2025
    veiculo: "COLING 2025"
    url: https://github.com/isadorasalles/HateBRXplain
    citacao: "Salles, I., Vargas, F., Benevenuto, F. (2025). HateBRXplain. In: Proceedings of COLING 2025. aclanthology 2025.coling-main.446."
    papel_no_projeto: "Justificativas humanas (trechos) para 3.500 comentários ofensivos do HateBR, já integradas pelo adaptador do HateBR. O repositório foi auditado: mesmos 7.000 comentários e mesmas justificativas do arquivo integrado (6.998 de 7.000 idênticas). Apoia o protocolo AMP-F (explicabilidade); pontuações de LIME/SHAP do repositório não são importadas."
    licenca_ou_direitos: "Repositório sem licença declarada; o projeto lê o arquivo do repositório HateBR (CC-BY-NC-4.0)."
    o_que_nao_e: "Atenção, SHAP ou LIME não provam a causa da decisão de um modelo; trechos humanos são justificativas, não verdade absoluta."
  - id: tupye
    tipo: dataset_avaliado
    titulo: "TuPy-E: detecting hate speech in Brazilian Portuguese social media with a novel dataset and comprehensive analysis of models"
    autores: ["Felipe Oliveira", "colaboradores (UFRJ/COPPE)"]
    ano: 2023
    veiculo: "arXiv:2312.17704"
    url: https://github.com/Silly-Machine/TuPyE-Expanded-Brazilian-Hate-Speech-Dataset
    citacao: "Oliveira et al. (2023). TuPy-E. arXiv:2312.17704."
    papel_no_projeto: "Avaliado só para sobreposição: reúne ToLD-Br, HateBR e Fortuna et al., por isso 64% dos documentos são do ToLD-Br e do HateBR. Seus rótulos não entram nos experimentos; evita-se treinar nele e testar nos corpora que ele contém."
    licenca_ou_direitos: "CC-BY-4.0 no cartão do Hugging Face, inconsistente com as licenças dos componentes (CC-BY-SA-4.0 e CC-BY-NC-4.0)."
    o_que_nao_e: "Não é corpus independente dos outros."
  - id: epn_psico_2025
