# Biblioteca editorial — exemplos FICTÍCIOS escritos para a exposição.
#
# NATUREZA: todas as frases são FICTÍCIAS. Foram escritas pela equipe a partir de padrões gerais de
# linguagem discutidos na literatura e no monitor. NÃO são citações de pessoas reais, NÃO foram copiadas
# de bases científicas nem de redes sociais e não identificam ninguém. O site as marca como "fictício".
#
# FILA DE REVISÃO: o comando `casos` coloca todas como PENDENTE. Nada daqui é publicado sem decisão humana
# (aprovar/corrigir/ambíguo) registrada com revisor, justificativa e histórico. Os rótulos propostos são
# uma leitura da equipe editorial, não decisão. Tipo "ambigua" é um resultado válido e esperado.
#
# ANONIMIZAÇÃO: sem cidade, evento, empresa, órgão, partido, político ou perfil reais. Um teste barra isso.
# Campos: tema (casos/temas.yaml) · contexto (cena imaginada) · mecanismo (o que a frase faz) ·
#         razoes (o que sustenta a leitura) · muda_se (o que poderia alterá-la).
versao: "1.0.0"
frases:
  # ---------------------------------------------------------------- discriminação regional
  - id: EX-01
    tema: discriminacao_regional
    tipo: exclusao
    texto: "Gente do interior é tudo atrasada, não sabe nem usar um aplicativo."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [discriminacao_regional]
    contexto: "Comentário num grupo de moradores sobre um aplicativo novo do transporte."
    mecanismo: "Transforma o lugar onde alguém vive num defeito pessoal."
    razoes:
      - "O “tudo” aplica a falha a um grupo inteiro definido pelo endereço."
      - "O aplicativo é só pretexto: a crítica é a quem mora no interior, não ao serviço."
    muda_se: "Se a frase falasse de falta de sinal de internet em áreas rurais, o alvo seria uma condição de infraestrutura."
    pode_publicar_ambigua: false
  - id: EX-02
    tema: discriminacao_regional
    tipo: exclusao
    texto: "Quem é do litoral só pensa em praia e festa, não dá pra confiar em trabalho dessa gente."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [discriminacao_regional]
    contexto: "Conversa sobre contratar uma equipe para uma obra."
    mecanismo: "Liga confiabilidade profissional ao lugar de origem."
    razoes:
      - "A conclusão (“não dá pra confiar”) vem do local, sem olhar para nenhuma pessoa real."
      - "Seria possível desconfiar de uma empresa específica; aqui se desconfia de todo um litoral."
    muda_se: "Se alguém contasse uma experiência ruim com uma empresa e parasse aí, seria queixa pontual, não generalização."
    pode_publicar_ambigua: false
  - id: EX-03
    tema: discriminacao_regional
    tipo: exclusao
    texto: "Esse sotaque do Sul já diz tudo: povo frio e arrogante."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [discriminacao_regional]
    contexto: "Reação a um vídeo de uma pessoa falando."
    mecanismo: "Usa o jeito de falar como prova de caráter."
    razoes:
      - "Sotaque indica de onde alguém veio, não como é; a frase ignora isso."
      - "“Povo” e “já diz tudo” fecham o julgamento antes de conhecer qualquer pessoa."
    muda_se: "Se fosse uma brincadeira entre amigos da própria região, o tom pesaria diferente, ainda que o estereótipo permaneça."
    pode_publicar_ambigua: false
  - id: EX-04
    tema: discriminacao_regional
    tipo: exclusao
    texto: "Nem adianta contratar gente do Norte, é tudo preguiçoso."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [discriminacao_regional]
    contexto: "Diálogo imaginado entre dois gerentes sobre uma vaga."
    mecanismo: "Usa a região como filtro de emprego."
    razoes:
      - "Funciona como regra de exclusão: a pessoa nem chega a ser avaliada."
      - "“Tudo preguiçoso” atribui um traço moral a milhões de pessoas diferentes."
    muda_se: "Se houvesse uma experiência de trabalho específica narrada, o foco sairia da região e iria para o caso."
    pode_publicar_ambigua: false
  - id: EX-05
    tema: discriminacao_regional
    tipo: exclusao
    texto: "A capital manda e o interior obedece; quem mora lá nem deveria opinar no que acontece aqui."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [discriminacao_regional, exclusao_social_territorial]
    contexto: "Discussão sobre uma decisão que afeta vários municípios."
    mecanismo: "Retira de um grupo o direito de opinar por causa do lugar."
    razoes:
      - "Não discute o argumento do outro lado; nega a voz de quem o diz."
      - "A hierarquia “manda/obedece” é atribuída ao território, não a uma decisão concreta."
    muda_se: "Se afirmasse que um órgão regional decide sozinho por lei, seria uma crítica institucional."
    pode_publicar_ambigua: false
  - id: EX-06
    tema: discriminacao_regional
    tipo: exclusao
    texto: "Cada região tem seu defeito, mas a do Sudeste é a pior: só tem gente falsa."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [discriminacao_regional]
    contexto: "Resposta numa conversa sobre onde morar."
    mecanismo: "Estereótipo que se apresenta como equilíbrio."
    razoes:
      - "Começar com “cada região tem seu defeito” não neutraliza o “só tem gente falsa”."
      - "Vale para qualquer região: trocar o nome não muda o mecanismo."
    muda_se: "Se a pessoa comparasse custo de vida ou clima, não haveria juízo sobre quem são os moradores."
    pode_publicar_ambigua: false

  # ---------------------------------------------------------------- xenofobia
  - id: EX-07
    tema: xenofobia
    tipo: exclusao
    texto: "Esses imigrantes vêm pra cá só pra tirar emprego de brasileiro."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [xenofobia]
    contexto: "Comentário sobre uma notícia de chegada de famílias estrangeiras."
    mecanismo: "Atribui a todo um grupo uma intenção única e hostil."
    razoes:
      - "Ninguém sabe os motivos de cada pessoa; a frase decide por todas."
      - "Põe imigrantes como ameaça, o que prepara o terreno para exclusão."
    muda_se: "Um debate sobre política de vagas ou fiscalização do trabalho, sem atribuir intenção a um povo, seria outra conversa."
    pode_publicar_ambigua: false
  - id: EX-08
    tema: xenofobia
    tipo: exclusao
    texto: "Venezuelano não tem jeito, onde chega estraga o bairro."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [xenofobia]
    contexto: "Fala imaginada numa reunião de condomínio."
    mecanismo: "Culpa uma nacionalidade inteira por um suposto efeito."
    razoes:
      - "“Não tem jeito” nega qualquer possibilidade de mudança ou diversidade individual."
      - "A nacionalidade é o único critério usado."
    muda_se: "Se alguém relatasse um problema concreto e identificasse o ato (barulho, por exemplo), não a origem, o alvo seria o ato."
    pode_publicar_ambigua: false
  - id: EX-09
    tema: xenofobia
    tipo: exclusao
    texto: "Se não nasceu aqui, não tem direito de reclamar do serviço público."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [xenofobia, exclusao_social_territorial]
    contexto: "Resposta a uma reclamação sobre fila num posto de atendimento."
    mecanismo: "Nega o direito de falar por causa do local de nascimento."
    razoes:
      - "Quem usa e paga pelo serviço também pode avaliá-lo."
      - "A frase desqualifica a pessoa e ignora a reclamação."
    muda_se: "Se tratasse de uma regra legal que de fato limita um benefício, a discussão seria sobre a regra, não sobre quem pode falar."
    pode_publicar_ambigua: false
  - id: EX-10
    tema: xenofobia
    tipo: exclusao
    texto: "Gringo que mora aqui tinha que aprender a falar direito ou voltar pro país dele."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [xenofobia]
    contexto: "Cena imaginada numa padaria."
    mecanismo: "Coloca a permanência da pessoa como condição de falar como o grupo."
    razoes:
      - "“Voltar pro país dele” sugere que a pessoa não pertence."
      - "Aprender o idioma é um pedido comum; ameaçar com a saída é outra coisa."
    muda_se: "“Seria bom oferecer aulas de português para quem chegou” é convite, não exclusão."
    pode_publicar_ambigua: false
  - id: EX-11
    tema: xenofobia
    tipo: exclusao
    texto: "Haitiano trabalha por qualquer preço porque não se valoriza; é cultura deles."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [xenofobia]
    contexto: "Conversa sobre salários numa obra."
    mecanismo: "Explica exploração como traço cultural da vítima."
    razoes:
      - "Troca a responsabilidade de quem paga pouco por uma suposta característica do povo."
      - "“É cultura deles” fecha a discussão com um estereótipo."
    muda_se: "Se a frase apontasse que a falta de documentação leva a salários menores, discutiria a condição, não a cultura."
    pode_publicar_ambigua: false

  # ---------------------------------------------------------------- racismo
  - id: EX-12
    tema: racismo
    tipo: exclusao
    texto: "Não sou racista, mas pessoas negras sempre dão mais trabalho em qualquer emprego."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [racismo]
    contexto: "Conversa imaginada sobre seleção de candidatos."
    mecanismo: "Declara-se isento e generaliza no mesmo fôlego."
    razoes:
      - "“Não sou racista, mas” costuma anteceder o que vem a seguir; o conteúdo é a generalização racial."
      - "“Sempre” e “qualquer emprego” não deixam espaço para exceções."
    muda_se: "Nada no contexto de trabalho transforma uma generalização racial em avaliação individual."
    pode_publicar_ambigua: false
  - id: EX-13
    tema: racismo
    tipo: exclusao
    texto: "Esse cabelo não é profissional; se quiser ser levada a sério aqui, vai ter que alisar."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [racismo]
    contexto: "Orientação imaginada de uma chefia a uma funcionária."
    mecanismo: "Impõe padrão de aparência que recai sobre traços associados a pessoas negras."
    razoes:
      - "Cabelo crespo ou cacheado vira “falta de profissionalismo” sem relação com o trabalho."
      - "A condição para ser levada a sério é mudar o corpo, não entregar resultado."
    muda_se: "Uma regra de segurança objetiva (por exemplo, prender o cabelo perto de máquinas) valeria para todas as pessoas e teria justificativa."
    pode_publicar_ambigua: false
  - id: EX-14
    tema: racismo
    tipo: exclusao
    texto: "Gente da cor dele sempre acaba dando problema, é só esperar."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [racismo]
    contexto: "Comentário imaginado sobre um novo vizinho."
    mecanismo: "Prevê mau comportamento com base na cor."
    razoes:
      - "O “é só esperar” indica uma profecia que já condena a pessoa."
      - "O critério é a cor, não qualquer ato observado."
    muda_se: "Se a frase citasse um fato ocorrido e verificável com essa pessoa, o debate seria sobre o fato, não sobre a cor."
    pode_publicar_ambigua: false
  - id: EX-15
    tema: racismo
    tipo: exclusao
    texto: "Pra uma pessoa negra, você se expressa muito bem."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [racismo]
    contexto: "“Elogio” imaginado depois de uma apresentação."
    mecanismo: "Elogio que revela expectativa de incapacidade."
    razoes:
      - "O “pra uma pessoa negra” indica que se esperava menos."
      - "Quem fala pode estar sendo gentil sem perceber, e o efeito continua sendo de rebaixamento."
    muda_se: "Sem a ressalva racial, seria um elogio comum. A comparação é o que muda a leitura."
    pode_publicar_ambigua: false
  - id: EX-16
    tema: racismo
    tipo: exclusao
    texto: "Moreno daquele jeito é sempre suspeito; melhor ficar de olho na loja quando ele entra."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [racismo]
    contexto: "Orientação imaginada de um dono de loja a um funcionário."
    mecanismo: "Vigilância dirigida pela aparência racial."
    razoes:
      - "O motivo da suspeita é a aparência, não uma ação."
      - "Vira prática: mais vigilância para um grupo, menos para outro."
    muda_se: "Se alguém estivesse realmente mexendo em mercadorias sem pagar, a atenção seria por um ato."
    pode_publicar_ambigua: false

  # ---------------------------------------------------------------- misoginia
  - id: EX-17
    tema: misoginia
    tipo: exclusao
    texto: "Mulher no volante, perigo constante; e na chefia, pior ainda."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [misoginia]
    contexto: "Brincadeira imaginada em uma roda de colegas."
    mecanismo: "Provérbio que se apresenta como humor, mas estende a incompetência a todas as mulheres."
    razoes:
      - "A “piada” funciona porque o estereótipo é repetido, não porque é dito uma só vez."
      - "A segunda parte leva o preconceito ao ambiente de trabalho."
    muda_se: "Ditos entre pessoas que se conhecem podem ter tom leve, mas o conteúdo ainda ensina que mulheres lideram pior."
    pode_publicar_ambigua: false
  - id: EX-18
    tema: misoginia
    tipo: exclusao
    texto: "Ela só chegou lá porque é bonita; competência mesmo ninguém viu."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [misoginia]
    contexto: "Comentário imaginado sobre uma promoção."
    mecanismo: "Reduz o mérito de uma mulher à aparência."
    razoes:
      - "Troca a pergunta “quais resultados ela entregou?” por “como ela é?”."
      - "Quem faz o comentário não apresenta nenhum fato sobre o trabalho."
    muda_se: "Se apontasse critérios de promoção que não foram seguidos, o alvo seria o processo."
    pode_publicar_ambigua: false
  - id: EX-19
    tema: misoginia
    tipo: exclusao
    texto: "Mulher que dá opinião política demais devia cuidar mais da casa."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [misoginia]
    contexto: "Resposta imaginada a um comentário numa rede social."
    mecanismo: "Aponta lugar social para silenciar a opinião."
    razoes:
      - "Não responde ao que foi dito; manda a pessoa para outra função."
      - "Só faz sentido se opinião política fosse “coisa de homem”."
    muda_se: "Se a frase dissesse “você opina demais” a qualquer pessoa, seria grosseria, não misoginia."
    pode_publicar_ambigua: false
  - id: EX-20
    tema: misoginia
    tipo: exclusao
    texto: "Na reunião de planejamento, melhor as meninas servirem o café e os homens decidirem."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [misoginia]
    contexto: "Combinado imaginado entre colegas antes de um evento."
    mecanismo: "Distribui tarefas por gênero e tira as mulheres da decisão."
    razoes:
      - "A divisão é feita pelo sexo das pessoas, não por função ou habilidade."
      - "Quem “serve” e quem “decide” reforçam hierarquia."
    muda_se: "Se o grupo sorteasse quem serve o café, a tarefa seria neutra."
    pode_publicar_ambigua: false
  - id: EX-21
    tema: misoginia
    tipo: exclusao
    texto: "Se ela está reclamando de assédio, deve ter provocado."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [misoginia]
    contexto: "Reação imaginada a uma denúncia numa empresa."
    mecanismo: "Transfere a responsabilidade do ato para a vítima."
    razoes:
      - "Presume culpa antes de qualquer apuração."
      - "Desestimula denúncias futuras ao dizer que quem denuncia é quem errou."
    muda_se: "Pedir que a denúncia seja apurada com provas é outra coisa: a frase descarta a apuração."
    pode_publicar_ambigua: false

  # ---------------------------------------------------------------- LGBTfobia
  - id: EX-22
    tema: lgbtfobia
    tipo: exclusao
    texto: "Esse tipo de família não é de verdade; criança precisa de pai e mãe, senão cresce errada."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia]
    contexto: "Comentário imaginado numa conversa sobre adoção."
    mecanismo: "Nega legitimidade a famílias com pais do mesmo sexo."
    razoes:
      - "“Não é de verdade” diz que essas famílias valem menos."
      - "“Cresce errada” é uma afirmação sobre pessoas que a frase não demonstra."
    muda_se: "Uma discussão sobre critérios de adoção igual para todos os casais, sem negar o valor das famílias, seria política pública."
    pode_publicar_ambigua: false
  - id: EX-23
    tema: lgbtfobia
    tipo: exclusao
    texto: "Casal gay não devia ir na festa da escola; as crianças não precisam ver isso."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia, exclusao_social_territorial]
    contexto: "Opinião imaginada em um grupo de pais."
    mecanismo: "Pede a exclusão de um casal de um espaço comum."
    razoes:
      - "A presença de um casal é tratada como algo a esconder."
      - "A frase não pede o mesmo de casais de sexos diferentes."
    muda_se: "Uma regra igual para todos (“sem demonstrações de afeto na escola”) mudaria o caso."
    pode_publicar_ambigua: false
  - id: EX-24
    tema: lgbtfobia
    tipo: exclusao
    texto: "Professor assim não pode dar aula pra criança, nem precisa saber se é bom."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia]
    contexto: "Reação imaginada a um professor que mencionou o marido."
    mecanismo: "Desqualifica um profissional pela orientação sexual, sem olhar para o trabalho."
    razoes:
      - "“Nem precisa saber se é bom” admite que a qualidade do trabalho não importa."
      - "A orientação é tratada como risco, sem fato que sustente isso."
    muda_se: "Se houvesse uma queixa concreta sobre uma conduta em sala, ela seria apurada pelo ato."
    pode_publicar_ambigua: false
  - id: EX-25
    tema: lgbtfobia
    tipo: exclusao
    texto: "Trans não é gente normal; que fique longe do banheiro das mulheres."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia, desumanizacao]
    contexto: "Comentário imaginado sobre regras de um shopping."
    mecanismo: "Classifica pessoas trans como anormais e pede afastamento."
    razoes:
      - "“Não é gente normal” desumaniza."
      - "O pedido de afastamento é dirigido a um grupo, não a uma conduta."
    muda_se: "Debates sobre estrutura de banheiros (privacidade, segurança) existem; esta frase nega a humanidade das pessoas."
    pode_publicar_ambigua: false
  - id: EX-26
    tema: lgbtfobia
    tipo: exclusao
    texto: "Lésbica é só mulher que não encontrou um homem de verdade."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia, misoginia]
    contexto: "Piada imaginada num almoço de família."
    mecanismo: "Reduz uma orientação a uma falta."
    razoes:
      - "Diz que a escolha afetiva de uma mulher só existe em relação aos homens."
      - "Apresentada como “piada”, repete uma ideia de que a orientação é algo a corrigir."
    muda_se: "Se a pessoa perguntasse com curiosidade, sem sentenciar, seria uma pergunta, não um julgamento."
    pode_publicar_ambigua: false

  # ---------------------------------------------------------------- estigma socioeconômico
  - id: EX-27
    tema: estigmatizacao_socioeconomica
    tipo: exclusao
    texto: "Quem mora em comunidade já sai de casa pensando em roubar."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [estigmatizacao_socioeconomica]
    contexto: "Comentário imaginado sobre um assalto noticiado."
    mecanismo: "Associa moradia a intenção criminosa."
    razoes:
      - "A maioria das pessoas ali trabalha e estuda; a frase as apaga."
      - "Transforma endereço em suspeita."
    muda_se: "Se a notícia falasse de um suspeito identificado pela polícia, o foco seria o caso, não o bairro."
    pode_publicar_ambigua: false
  - id: EX-28
    tema: estigmatizacao_socioeconomica
    tipo: exclusao
    texto: "Pobre não sabe votar, vende o voto por uma cesta básica."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [estigmatizacao_socioeconomica, hostilidade_politica]
    contexto: "Comentário imaginado depois de uma eleição."
    mecanismo: "Desqualifica o voto de um grupo pela renda."
    razoes:
      - "Presume que a renda determina a escolha, sem olhar para as razões das pessoas."
      - "Ignora que compra de votos é crime de quem compra, não prova de quem vota."
    muda_se: "Criticar práticas de compra de votos, sem atribuí-las aos pobres, seria crítica legítima."
    pode_publicar_ambigua: false
  - id: EX-29
    tema: estigmatizacao_socioeconomica
    tipo: exclusao
    texto: "Esse povo da periferia não tem educação, por isso a cidade é suja."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [estigmatizacao_socioeconomica]
    contexto: "Reclamação imaginada sobre lixo nas ruas."
    mecanismo: "Culpa um grupo social por um problema coletivo."
    razoes:
      - "O problema do lixo envolve coleta, estrutura e hábitos de todos os bairros."
      - "“Não tem educação” serve de ofensa e explicação ao mesmo tempo."
    muda_se: "Cobrar mais coleta nos bairros afastados trataria o problema, sem acusar quem mora lá."
    pode_publicar_ambigua: false
  - id: EX-30
    tema: estigmatizacao_socioeconomica
    tipo: exclusao
    texto: "Emprego bom é pra quem estudou em escola cara; o resto que aceite o que sobrar."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [estigmatizacao_socioeconomica]
    contexto: "Fala imaginada num processo seletivo."
    mecanismo: "Naturaliza a exclusão por origem social."
    razoes:
      - "Define quem “merece” pela escola paga, não por habilidade."
      - "“O que sobrar” é condição imposta a quem já tem menos oportunidade."
    muda_se: "Se a vaga exigisse uma formação específica, o critério seria a formação, não a escola."
    pode_publicar_ambigua: false
  - id: EX-31
    tema: estigmatizacao_socioeconomica
    tipo: exclusao
    texto: "Não alugo apartamento pra quem veio de bairro pobre, já sei como é."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [estigmatizacao_socioeconomica, exclusao_social_territorial]
    contexto: "Fala imaginada de um proprietário."
    mecanismo: "Recusa antes de conhecer, com base no endereço de origem."
    razoes:
      - "“Já sei como é” substitui a análise da pessoa por um palpite."
      - "Pedir fiador ou comprovante de renda a todos seria critério; o bairro, não."
