# Biblioteca ampliada — exemplos FICTÍCIOS (EX-69 a EX-158), com foco em racismo, LGBTfobia,
# intolerância religiosa, capacitismo, misoginia e xenofobia, além dos contrapontos sem discriminação.
#
# NATUREZA: todas as frases são FICTÍCIAS, escritas pela equipe a partir de padrões gerais de linguagem
# descritos na literatura. NÃO são citações de pessoas reais, NÃO foram copiadas de bases científicas
# (ToLD-Br, HateBR, MultiDomainYT-ToxBR etc.) nem de redes sociais, e não identificam ninguém.
# Os corpora científicos continuam fora do repositório e do site.
#
# FILA DE REVISÃO: o comando `casos` coloca todas como PENDENTE. Nada daqui vai ao site sem decisão humana
# registrada (aprovar/corrigir/ambíguo) com revisor e histórico. Os rótulos são uma leitura PROPOSTA pela
# equipe editorial, não decisão. Sem xingamentos explícitos: a discriminação aparece como estereótipo,
# exclusão e minimização, que é como costuma aparecer. Cerca de um terço dos casos NÃO é discriminação.
versao: "1.0.0"
frases:
  # ---------------------------------------------------------------- racismo
  - id: EX-69
    tema: racismo
    tipo: exclusao
    texto: "Eu não vejo cor, mas prefiro não alugar o apartamento para gente dessa cor."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [racismo]
    contexto: "Conversa imaginada entre dois proprietários de imóveis."
    mecanismo: "Nega o preconceito e recusa moradia pela cor no mesmo fôlego."
    razoes: ["A frase diz que não vê cor e logo usa a cor como critério.", "Recusar moradia por cor de pele é exclusão, não preferência pessoal."]
    muda_se: "Um critério objetivo e igual para todos (renda comprovada, por exemplo) seria outra conversa; a cor não é critério."
    pode_publicar_ambigua: false
  - id: EX-70
    tema: racismo
    tipo: exclusao
    texto: "Ele até é inteligente, para um negro."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [racismo]
    contexto: "Comentário imaginado sobre um colega de trabalho."
    mecanismo: "Elogio que pressupõe que pessoas negras costumam ser menos inteligentes."
    razoes: ["O “até” e o “para um negro” tratam a inteligência como exceção do grupo.", "O elogio carrega o preconceito que diz combater."]
    muda_se: "Se elogiasse o trabalho da pessoa sem mencionar a cor, não haveria o pressuposto."
    pode_publicar_ambigua: false
  - id: EX-71
    tema: racismo
    tipo: exclusao
    texto: "Na loja, a orientação é ficar de olho em quem tem aquela cor de pele; é questão de experiência."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [racismo]
    contexto: "Instrução imaginada de um gerente a uma equipe de vendas."
    mecanismo: "Transforma a cor em suspeita de furto."
    razoes: ["A vigilância recai sobre um grupo definido pela cor, e não sobre comportamentos.", "“Experiência” é o nome dado ao estereótipo para ele parecer razoável."]
    muda_se: "Vigiar comportamentos concretos (esconder produto, por exemplo), igual para qualquer cliente, não seria racial."
    pode_publicar_ambigua: false
  - id: EX-72
    tema: racismo
    tipo: exclusao
    texto: "Cabelo black power no cartão de visita da empresa? Não combina com a imagem que a gente quer passar."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [racismo]
    contexto: "Reunião imaginada de marketing."
    mecanismo: "Declara um traço associado a pessoas negras como inadequado."
    razoes: ["O penteado natural vira “imagem ruim” sem relação com o trabalho.", "A empresa impõe um padrão estético que exclui um grupo."]
    muda_se: "Uma regra de segurança objetiva aplicada a todas as pessoas teria justificativa; a “imagem” não tem."
    pode_publicar_ambigua: false
  - id: EX-73
    tema: racismo
    tipo: exclusao
    texto: "Racismo no Brasil é exagero; essa gente só quer vitimismo pra ganhar vantagem."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [racismo]
    contexto: "Opinião imaginada numa conversa sobre políticas de igualdade racial."
    mecanismo: "Nega a discriminação e atribui má-fé a quem a denuncia."
    razoes: ["“Essa gente” agrupa pessoas negras e lhes atribui um motivo oportunista.", "Em vez de discutir dados, desqualifica quem fala."]
    muda_se: "Discordar de uma política específica, com argumentos, seria crítica; atribuir má-fé a um grupo não é."
    pode_publicar_ambigua: false
  - id: EX-74
    tema: racismo
    tipo: exclusao
    texto: "Aquele bairro ficou perigoso depois que começaram a chegar famílias negras."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [racismo, exclusao_social_territorial]
    contexto: "Comentário imaginado numa conversa de vizinhos."
    mecanismo: "Associa a cor dos moradores à insegurança."
    razoes: ["Liga criminalidade à chegada de um grupo racial, sem nenhum fato.", "Culpa famílias inteiras pela percepção de perigo."]
    muda_se: "Se apontasse um problema concreto de iluminação ou policiamento, o alvo seria o serviço público, não as famílias."
    pode_publicar_ambigua: false
  - id: EX-75
    tema: racismo
    tipo: exclusao
    texto: "Na minha família ninguém se mistura; a gente preserva a raça."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [racismo]
    contexto: "Fala imaginada num jantar de família."
    mecanismo: "Defende separação racial como valor."
    razoes: ["“Preservar a raça” trata outros grupos como ameaça à pureza.", "Faz da proibição de relações entre pessoas de cores diferentes uma regra de família."]
    muda_se: "Falar de tradições culturais da família sem hierarquizar pessoas ou grupos não seria racismo."
    pode_publicar_ambigua: false
  - id: EX-76
    tema: racismo
    tipo: exclusao
    texto: "Moreno clarinho na recepção tudo bem; agora pessoa muito escura assusta o cliente."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [racismo]
    contexto: "Conversa imaginada sobre contratação de recepcionista."
    mecanismo: "Gradua o valor da pessoa pelo tom da pele."
    razoes: ["O tom de pele define quem serve para o cargo.", "Atribui ao cliente um preconceito para justificar a exclusão."]
    muda_se: "Se o critério fosse atendimento e experiência, a cor não apareceria na decisão."
    pode_publicar_ambigua: false
  - id: EX-77
    tema: racismo
    tipo: exclusao
    texto: "Quem tem sangue indígena não consegue administrar dinheiro; é de natureza."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [racismo]
    contexto: "Opinião imaginada numa conversa sobre sociedade em negócio."
    mecanismo: "Atribui incapacidade a um povo por origem étnica."
    razoes: ["“É de natureza” trata a etnia como destino.", "Generaliza um traço negativo a todas as pessoas de um grupo."]
    muda_se: "Falar da situação financeira de uma pessoa concreta, com fatos, seria outro assunto; a etnia não explica."
    pode_publicar_ambigua: false
  - id: EX-78
    tema: racismo
    tipo: nao_discriminatoria
    texto: "O segurança me seguiu pela loja inteira só por eu ser negro. Isso é racismo e eu vou denunciar."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [critica_politica_legitima]
    contexto: "Relato imaginado de um cliente nas redes."
    mecanismo: "Denuncia uma experiência de discriminação."
    razoes: ["Cita racismo para nomeá-lo e combatê-lo, não para praticá-lo.", "Quem relata a própria experiência não ataca nenhum grupo."]
    muda_se: "Um classificador que olhasse só as palavras “negro” e “racismo” erraria aqui; o contexto mostra denúncia."
    pode_publicar_ambigua: false
  - id: EX-79
    tema: sem_discriminacao
    tipo: nao_discriminatoria
    texto: "A pesquisa mostra que pessoas negras recebem, em média, menos do que pessoas brancas na mesma função."
    origem: sintetica_ilustrativa
    rotulos_editoriais: []
    contexto: "Frase imaginada de uma reportagem sobre desigualdade salarial."
    mecanismo: "Cita um dado sobre desigualdade, sem atacar ninguém."
    razoes: ["Descreve uma diferença medida, sem atribuir causa ao grupo.", "Mencionar raça para falar de desigualdade não é racismo."]
    muda_se: "Se a frase concluísse que a diferença “é porque trabalham menos”, passaria a ser estereótipo."
    pode_publicar_ambigua: false
  - id: EX-80
    tema: depende_contexto
    tipo: ambigua
    texto: "Aqui no grupo a gente brinca com as nossas origens, ninguém se ofende."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [ambigua]
    contexto: "Mensagem imaginada num grupo de amigos."
    mecanismo: "Humor entre pessoas próximas pode ser carinho ou normalizar estereótipos."
    razoes: ["Brincadeira entre quem compartilha a origem pode ser afeto.", "“Ninguém se ofende” é a opinião de quem fala; quem ouve pode pensar diferente."]
    muda_se: "Ver as piadas e quem as faz resolveria. Sem isso, a leitura honesta é “depende”."
    pode_publicar_ambigua: true

  # ---------------------------------------------------------------- LGBTfobia
  - id: EX-81
    tema: lgbtfobia
    tipo: exclusao
    texto: "Não tenho nada contra gays, mas não precisa ficar se beijando na frente das crianças."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia]
    contexto: "Comentário imaginado sobre um casal numa praça."
    mecanismo: "Aceitação declarada com restrição que só vale para casais do mesmo sexo."
    razoes: ["Um beijo entre um casal de sexos diferentes não seria questionado.", "Trata a afeição de pessoas LGBT como algo impróprio para crianças."]
    muda_se: "Se a regra valesse igualmente para qualquer casal em local público, seria uma regra de convivência."
    pode_publicar_ambigua: false
  - id: EX-82
    tema: lgbtfobia
    tipo: exclusao
    texto: "Ela diz que é lésbica, mas é só falta de homem de verdade."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia, misoginia]
    contexto: "Comentário imaginado sobre uma colega."
    mecanismo: "Nega a identidade da pessoa e a reduz a uma carência."
    razoes: ["Diz que a orientação alheia não existe de verdade.", "Coloca o desejo masculino como centro da vida de uma mulher."]
    muda_se: "Perguntar com respeito sobre a vida de alguém não nega a identidade; esta frase nega."
    pode_publicar_ambigua: false
  - id: EX-83
    tema: lgbtfobia
    tipo: exclusao
    texto: "Se mostrar que é trans no currículo, esquece a vaga; cliente não aceita."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia, exclusao_social_territorial]
    contexto: "Conversa imaginada entre duas pessoas do setor de contratação."
    mecanismo: "Justifica a exclusão no trabalho atribuindo o preconceito a terceiros."
    razoes: ["A identidade de gênero vira motivo para descartar a candidatura.", "“Cliente não aceita” transfere a culpa e mantém a exclusão."]
    muda_se: "Se a conversa fosse sobre como combater esse preconceito dentro da empresa, o sentido seria o oposto."
    pode_publicar_ambigua: false
  - id: EX-84
    tema: lgbtfobia
    tipo: exclusao
    texto: "Prefiro que meu filho não tenha professor gay; vai que influencia."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia]
    contexto: "Opinião imaginada numa reunião de pais."
    mecanismo: "Trata a orientação sexual como algo contagioso e perigoso."
    razoes: ["Pressupõe que ser gay é uma influência negativa.", "Descarta um profissional pela orientação, e não pelo trabalho."]
    muda_se: "Perguntar sobre a qualidade das aulas seria legítimo; a orientação do professor não é critério."
    pode_publicar_ambigua: false
  - id: EX-85
    tema: lgbtfobia
    tipo: exclusao
    texto: "Essa gente quer impor a sexualidade em tudo; antigamente cada um guardava isso para dentro de casa."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia, exclusao_social_territorial]
    contexto: "Comentário imaginado sobre uma parada de orgulho."
    mecanismo: "Pede que pessoas LGBT fiquem invisíveis no espaço público."
    razoes: ["“Essa gente” agrupa pessoas por orientação.", "A exigência de esconder só recai sobre quem não é heterossexual."]
    muda_se: "Criticar uma regra de trânsito durante um evento seria outro tema; pedir invisibilidade a um grupo, não."
    pode_publicar_ambigua: false
  - id: EX-86
    tema: lgbtfobia
    tipo: exclusao
    texto: "Pessoa trans no banheiro feminino é um perigo para as mulheres."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia]
    contexto: "Opinião imaginada numa conversa sobre regras de uso de banheiros."
    mecanismo: "Associa pessoas trans a perigo, sem fato nenhum."
    razoes: ["Generaliza risco a um grupo inteiro apenas pela identidade.", "O debate sobre regras de acesso pode ser feito sem chamar as pessoas de perigosas."]
    muda_se: "Discutir uma regra específica com dados e preocupações concretas seria debate público; rotular o grupo como perigo não é."
    pode_publicar_ambigua: false
  - id: EX-87
    tema: lgbtfobia
    tipo: exclusao
    texto: "Cuidado com esse colega, é meio afeminado; não dá para confiar em reunião de negócio."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia]
    contexto: "Alerta imaginado entre dois sócios."
    mecanismo: "Associa jeito de ser a falta de confiabilidade profissional."
    razoes: ["Maneirismos viram sinal de caráter duvidoso.", "Nenhum comportamento profissional é citado."]
    muda_se: "Se a desconfiança viesse de um fato (prazo descumprido, por exemplo), seria sobre a conduta, não o jeito."
    pode_publicar_ambigua: false
  - id: EX-88
    tema: lgbtfobia
    tipo: exclusao
    texto: "Casal de homens não é família de verdade, é só uma imitação."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia]
    contexto: "Opinião imaginada numa conversa de família."
    mecanismo: "Desvaloriza famílias formadas por pessoas do mesmo sexo."
    razoes: ["Chama de “imitação” uma família real.", "Coloca um grupo como menos legítimo para existir."]
    muda_se: "Falar de uma visão religiosa pessoal sobre casamento, sem depreciar as pessoas, já seria diferente."
    pode_publicar_ambigua: false
  - id: EX-89
    tema: lgbtfobia
    tipo: exclusao
    texto: "Se meu filho virar gay eu deixo de falar com ele."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia]
    contexto: "Desabafo imaginado de um pai numa conversa de amigos."
    mecanismo: "Condiciona o afeto à orientação sexual."
    razoes: ["Ameaça cortar o vínculo por ser quem a pessoa é.", "Trata a orientação como falha a ser punida."]
    muda_se: "Se a frase dissesse “tenho medo de errar e quero aprender a acolher”, a leitura seria outra."
    pode_publicar_ambigua: false
  - id: EX-90
    tema: lgbtfobia
    tipo: exclusao
    texto: "Bissexual é só indeciso que quer o melhor dos dois mundos."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [lgbtfobia]
    contexto: "Comentário imaginado numa roda de conversa."
    mecanismo: "Nega a legitimidade de uma orientação."
    razoes: ["Diz que a orientação é indecisão ou conveniência.", "Descarta a experiência de quem a vive."]
    muda_se: "Uma pergunta honesta (“como você percebeu isso?”) abriria diálogo; esta frase fecha."
    pode_publicar_ambigua: false
  - id: EX-91
    tema: lgbtfobia
    tipo: nao_discriminatoria
    texto: "Fui expulso de casa por ser gay. A gente precisa falar mais sobre acolhimento das famílias."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [critica_politica_legitima]
    contexto: "Relato imaginado numa roda de conversa de um centro comunitário."
    mecanismo: "Relata a própria experiência e pede acolhimento."
    razoes: ["Cita a orientação para falar da própria vida, não para atacar.", "Pede solução (acolhimento), não punição de ninguém."]
    muda_se: "Um classificador que reagisse só à palavra “gay” erraria aqui."
    pode_publicar_ambigua: false
  - id: EX-92
    tema: sem_discriminacao
    tipo: nao_discriminatoria
    texto: "A cantora lançou um álbum novo e fala abertamente na entrevista sobre ser lésbica."
    origem: sintetica_ilustrativa
    rotulos_editoriais: []
    contexto: "Legenda imaginada de uma matéria cultural."
    mecanismo: "Menção neutra à orientação de uma pessoa, em tom informativo."
    razoes: ["Informa um fato dito pela própria pessoa.", "Não há julgamento nem generalização."]
    muda_se: "Se a legenda sugerisse que isso é um defeito ou algo a esconder, a leitura mudaria."
    pode_publicar_ambigua: false
  - id: EX-93
    tema: critica_legitima
    tipo: nao_discriminatoria
    texto: "Discordo desse projeto de lei, mas respeito o direito de qualquer casal de se casar."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [critica_politica_legitima]
    contexto: "Opinião imaginada de uma pessoa indecisa sobre uma proposta."
    mecanismo: "Discorda de uma proposta e afirma respeito pelas pessoas."
    razoes: ["A crítica é ao projeto, não a um grupo.", "Deixa explícito o respeito ao direito dos casais."]
    muda_se: "Se a frase dissesse que casais do mesmo sexo “não merecem” o direito, o alvo seriam as pessoas."
    pode_publicar_ambigua: false
  - id: EX-94
    tema: depende_contexto
    tipo: ambigua
    texto: "Meu amigo gay faz piada com a própria vida e eu repito, ele nem liga."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [ambigua]
    contexto: "Comentário imaginado numa conversa descontraída."
    mecanismo: "Piada contada por quem pertence ao grupo pode ser aceita; repetida por outro, pode machucar."
    razoes: ["A piada vem de alguém do grupo e pode ser autoironia.", "Repetir para outras pessoas muda o efeito, e “ele nem liga” é só a percepção de quem fala."]
    muda_se: "Conhecer a piada e o público em que é repetida resolveria. Sem isso, “depende”."
    pode_publicar_ambigua: true

  # ---------------------------------------------------------------- intolerância religiosa
  - id: EX-95
    tema: intolerancia_religiosa
    tipo: exclusao
    texto: "Esse povo de religião de matriz africana faz coisa errada; melhor ficar longe."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [intolerancia_religiosa]
    contexto: "Comentário imaginado sobre vizinhos."
    mecanismo: "Associa uma religião inteira a prática errada e incentiva o afastamento."
    razoes: ["“Esse povo” agrupa as pessoas pela fé.", "“Coisa errada” é dito sem nenhum fato."]
    muda_se: "Discordar da doutrina, sem depreciar quem a pratica, seria crítica a ideias."
    pode_publicar_ambigua: false
  - id: EX-96
    tema: intolerancia_religiosa
    tipo: exclusao
    texto: "Ateu não tem valores; não dá para confiar nessa gente."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [intolerancia_religiosa]
    contexto: "Opinião imaginada numa conversa sobre candidaturas."
    mecanismo: "Atribui falta de caráter a quem não tem religião."
    razoes: ["Liga moral à crença e generaliza a todo um grupo.", "Desconfiança sem nenhum fato sobre a pessoa."]
    muda_se: "Falar de uma conduta concreta de alguém, com fatos, seria sobre a pessoa, não sobre a crença."
    pode_publicar_ambigua: false
  - id: EX-97
    tema: intolerancia_religiosa
    tipo: exclusao
    texto: "Muçulmano é tudo extremista; nem devia entrar no país."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [intolerancia_religiosa, xenofobia]
    contexto: "Comentário imaginado sobre uma notícia internacional."
    mecanismo: "Generaliza violência a uma religião e propõe exclusão."
    razoes: ["“Tudo extremista” aplica o pior caso a milhões de pessoas.", "Propõe barrar pessoas apenas pela fé."]
    muda_se: "Criticar um grupo violento específico, com nome e fatos, não equivale a atacar uma religião inteira."
    pode_publicar_ambigua: false
  - id: EX-98
    tema: intolerancia_religiosa
    tipo: exclusao
    texto: "Judeu só pensa em dinheiro; não vale a pena fazer sociedade."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [intolerancia_religiosa]
    contexto: "Conversa imaginada entre dois empreendedores."
    mecanismo: "Repete um estereótipo histórico contra um povo e justifica exclusão."
    razoes: ["Atribui um defeito a todo um grupo religioso e étnico.", "O estereótipo é antigo e foi usado para perseguir pessoas."]
    muda_se: "Se a recusa se baseasse nas condições do negócio, a religião do sócio não apareceria."
    pode_publicar_ambigua: false
  - id: EX-99
    tema: intolerancia_religiosa
    tipo: exclusao
    texto: "Candomblé é coisa do demônio; terreiro devia ser fechado no bairro."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [intolerancia_religiosa]
    contexto: "Opinião imaginada numa reunião de moradores."
    mecanismo: "Demoniza uma religião e pede a eliminação do espaço de culto."
    razoes: ["Pede fechar um local de culto por causa da fé de quem o frequenta.", "Chama a religião de “coisa do demônio”, o que desqualifica as pessoas."]
    muda_se: "Reclamar de barulho em qualquer local, com a mesma regra para todos, seria outra questão."
    pode_publicar_ambigua: false
  - id: EX-100
    tema: intolerancia_religiosa
    tipo: exclusao
    texto: "Católico é tudo hipócrita e ignorante; nem vale discutir com essa gente."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [intolerancia_religiosa]
    contexto: "Resposta imaginada num debate online."
    mecanismo: "Desqualifica pessoas de uma religião, também uma maioria."
    razoes: ["A regra vale para qualquer religião: generalizar e desprezar um grupo pela fé é intolerância.", "Encerra o diálogo antes de ouvir qualquer pessoa."]
    muda_se: "Criticar decisões de uma instituição, com fatos, seria crítica legítima."
    pode_publicar_ambigua: false
  - id: EX-101
    tema: intolerancia_religiosa
    tipo: exclusao
    texto: "O vizinho é de outra religião, então não deixo as crianças brincarem com os filhos dele."
    origem: sintetica_ilustrativa
    rotulos_editoriais: [intolerancia_religiosa, exclusao_social_territorial]
    contexto: "Desabafo imaginado numa conversa entre mães."
    mecanismo: "Afasta crianças por causa da religião da família."
    razoes: ["A religião é o único critério de exclusão.", "A consequência recai sobre crianças."]
