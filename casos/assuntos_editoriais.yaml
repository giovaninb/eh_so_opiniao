# Assuntos editoriais — camada de navegação para visitantes.
# A taxonomia científica (datasets/taxonomy.yaml) e os temas de exibição (casos/temas.yaml) continuam intactos.
# Para acrescentar um assunto: copie um bloco, dê um id estável (slug), associe temas/rótulos/grupos/subtemas
# e rode a publicação. Assuntos sem frases aprovadas ficam ocultos. Não edite nomes na interface.

versao: "1.0.0"
minimo_para_exibir: 1

grupos:
  - id: genero
    nome: Gênero, sexualidade e relacionamentos
    descricao: Machismo, masculinidade, identidade de gênero, orientação sexual e formatos de relação.
    ordem: 1
  - id: raca_origem
    nome: Raça, origem e pertencimento
    descricao: Racismo, povos indígenas, nacionalidade, região e o lugar onde a pessoa vive.
    ordem: 2
  - id: deficiencia_idade
    nome: Deficiência, acessibilidade e idade
    descricao: Capacitismo, deficiências não aparentes, barreiras e etarismo.
    ordem: 3
  - id: religiao
    nome: Religião e liberdade de crença
    descricao: Intolerância, religiões específicas e críticas a instituições sem atacar fiéis.
    ordem: 4
  - id: sociedade
    nome: Sociedade, classe e política
    descricao: Renda, moradia, benefícios, voto e participação democrática.
    ordem: 5
  - id: linguagem
    nome: Linguagem e interpretação
    descricao: Elogio enviesado, ironia, contexto ausente, críticas legítimas e frases sem discriminação.
    ordem: 6

situacoes:
  - id: trabalho
    nome: No trabalho
    descricao: Contratação, chefia, salário e convívio profissional.
    assuntos: [mulheres, homens, racismo, pessoas_com_deficiencia, deficiencias_nao_aparentes, neurodivergencia, pobreza, intolerancia_politica]
  - id: escola
    nome: Na escola
    descricao: Sala de aula, matrícula, bullying e o que se ensina sobre diferenças.
    assuntos: [orientacao_sexual, bissexualidade, pessoas_trans, racismo, pessoas_com_deficiencia, pessoas_idosas]
  - id: familia
    nome: Na família
    descricao: Parentesco, cuidado, nomes, pronomes e formatos de casa.
    assuntos: [mulheres, homens, pessoas_trans, nao_monogamia, familias, pessoas_idosas, autonomia_e_infantilizacao]
  - id: relacionamentos
    nome: Nos relacionamentos
    descricao: Namoro, casamento, não monogamia consensual e expectativas afetivas.
    assuntos: [mulheres, homens, orientacao_sexual, bissexualidade, nao_monogamia, familias]
  - id: redes
    nome: Nas redes sociais
    descricao: Comentários, piadas, generalizações e o que circula como “só uma opinião”.
    assuntos: [racismo_velado, xenofobia, elogio_preconceituoso, estereotipos, ironia, depende_contexto]
  - id: servicos
    nome: Em atendimentos e serviços
    descricao: Loja, banco, transporte, órgão público e quem é tratado como cliente.
    assuntos: [racismo, pessoas_com_deficiencia, barreiras_de_acessibilidade, visao_e_condicoes_visuais, xenofobia, periferias]
  - id: saude
    nome: Na saúde
    descricao: Consulta, diagnóstico, saúde mental e condições que não se vêem.
    assuntos: [deficiencias_nao_aparentes, neurodivergencia, pessoas_com_deficiencia, pessoas_trans, pessoas_idosas]
  - id: espaco_publico
    nome: No espaço público
    descricao: Rua, bairro, moradia, religião visível e quem “pode” estar ali.
    assuntos: [exclusao_territorial, moradia, religioes_matriz_africana, povos_indigenas, periferias, xenofobia]

